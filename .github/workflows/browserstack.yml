name: BrowserStack Appium

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  appium-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Appium tests on BrowserStack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_ID: ${{ secrets.BROWSERSTACK_APP_ID }}
          BROWSERSTACK_BUILD_NAME: Pixel Clock GitHub Actions
          BROWSERSTACK_APPIUM_VERSION: 2.0.0
        run: npm run test:browserstack

      - name: Publish failed test details
        if: failure()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const resultsDirectory = 'allure-results';
          if (!fs.existsSync(resultsDirectory)) {
            console.log('::error title=BrowserStack test failure::No Allure results were generated.');
            process.exit(0);
          }

          const failures = fs.readdirSync(resultsDirectory)
            .filter((file) => file.endsWith('-result.json'))
            .map((file) => JSON.parse(fs.readFileSync(path.join(resultsDirectory, file), 'utf8')))
            .filter((result) => result.status === 'failed' || result.status === 'broken');

          if (failures.length === 0) {
            console.log('::error title=BrowserStack test failure::The WDIO process failed without a failed Allure test result.');
          }

          for (const failure of failures) {
            const details = failure.statusDetails || {};
            const message = [details.message, details.trace]
              .filter(Boolean)
              .join('\n')
              .replaceAll('%', '%25')
              .replaceAll('\r', '%0D')
              .replaceAll('\n', '%0A');
            const title = String(failure.name || 'BrowserStack test failure')
              .replaceAll('%', '%25')
              .replaceAll('\r', '%0D')
              .replaceAll('\n', '%0A');
            console.log(`::error title=${title}::${message || failure.status}`);
          }
          NODE

      - name: Generate Allure Report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload Test Logs & Screenshots Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appium-logs-screenshots
          path: |
            logs/
            log/
          retention-days: 14
