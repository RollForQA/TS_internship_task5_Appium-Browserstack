name: BrowserStack Appium

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  appium-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BROWSERSTACK_APP_ID: ${{ secrets.BROWSERSTACK_APP_ID }}
      BROWSERSTACK_BUILD_NAME: Pixel Clock GitHub Actions

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Appium tests on BrowserStack
        run: npm run test:browserstack

      - name: Generate Allure Report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload Test Logs & Screenshots Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appium-logs-screenshots
          path: |
            logs/
            log/
          retention-days: 14
